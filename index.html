<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เครื่องคิดเกรด · GPA Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <!-- decorative doodles -->
  <svg class="doodle doodle-star-1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.2 9.2 L23 12 L14.2 14.8 L12 24 L9.8 14.8 L1 12 L9.8 9.2 Z"/></svg>
  <svg class="doodle doodle-star-2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.2 9.2 L23 12 L14.2 14.8 L12 24 L9.8 14.8 L1 12 L9.8 9.2 Z"/></svg>
  <svg class="doodle doodle-swirl" viewBox="0 0 60 60" aria-hidden="true"><path d="M5 30 Q5 5 30 5 Q55 5 55 30 Q55 50 35 50 Q20 50 20 38" fill="none" stroke-width="4" stroke-linecap="round"/></svg>

  <header class="hero">
    <div class="badge">
      <svg viewBox="0 0 48 32" class="cap-icon" aria-hidden="true">
        <path d="M24 2 L46 12 L24 22 L2 12 Z"/>
        <path d="M12 16.5 V25 C12 28 17 30.5 24 30.5 C31 30.5 36 28 36 25 V16.5" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="43" y1="12" x2="43" y2="23" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <span>เครื่องคิดเกรด</span>
    </div>
    <h1>คำนวณเกรดเฉลี่ย<br>ของคุณแบบง่าย ๆ</h1>
    <p class="subtitle">ใส่รายวิชา หน่วยกิต แล้วเลือกเกรดที่ได้ — ระบบคำนวณ GPA ให้ทันที</p>
  </header>

  <main class="layout">

    <section class="card subjects-card">
      <div class="table-head">
        <span>รายวิชา</span>
        <span>หน่วยกิต</span>
        <span>เกรด</span>
        <span class="col-spacer" aria-hidden="true"></span>
      </div>

      <div id="subjectList" class="subject-list"></div>

      <button id="addRow" type="button" class="btn-add">
        <span class="plus">+</span> เพิ่มรายวิชา
      </button>

      <div class="actions">
        <button id="resetBtn" type="button" class="btn-ghost">ล้างข้อมูลทั้งหมด</button>
      </div>
    </section>

    <aside class="card summary-card">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 160 160" aria-hidden="true">
          <defs>
            <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8FBF9F"/>
              <stop offset="100%" stop-color="#C9B8FF"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="80" cy="80" r="68"/>
          <circle id="ringFg" class="ring-fg" cx="80" cy="80" r="68"/>
        </svg>
        <div class="ring-center">
          <span id="gpaValue">0.00</span>
          <small>GPA</small>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span id="totalCredits">0</span>
          <small>หน่วยกิตรวม</small>
        </div>
        <div class="stat">
          <span id="totalSubjects">0</span>
          <small>รายวิชา</small>
        </div>
      </div>

      <p id="feedbackMsg" class="feedback">เริ่มกรอกรายวิชาทางซ้ายได้เลย ✨</p>
    </aside>

  </main>

  <footer class="footer">ทำด้วยใจ 🤍 · คำนวณผลแบบเรียลไทม์ ไม่ต้องกดบันทึก</footer>

</div>

<template id="rowTemplate">
  <div class="subject-row">
    <input type="text" class="input subject-name" placeholder="เช่น แคลคูลัส 1" maxlength="40">
    <input type="number" class="input credit-input" min="0" max="10" step="0.5" value="3">
    <select class="input grade-select">
      <option value="4">A</option>
      <option value="3.5">B+</option>
      <option value="3" selected>B</option>
      <option value="2.5">C+</option>
      <option value="2">C</option>
      <option value="1.5">D+</option>
      <option value="1">D</option>
      <option value="0">F</option>
    </select>
    <button type="button" class="btn-remove" aria-label="ลบรายวิชานี้">✕</button>
  </div>
</template>

<script src="script.js"></script>
</body>
</html>
